<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/home.css"><link rel="stylesheet" href="css/dashboard.css"><title>إنشاء حساب | Civil Academy 3D</title><script src="js/theme.js"></script>
</head>
<body class="auth">
<form id="registerForm" class="glass auth-card" novalidate>
  <a class="logo" href="index.html">Civil Academy 3D</a>
  <h1>إنشاء حساب</h1>
  <p class="lead" data-trial-line>تبدأ تجربتك المجانية لمدة <span data-trial>7</span> أيام فور التسجيل.</p>
  <label>الاسم الكامل<input name="full_name" autocomplete="name" maxlength="100" required></label>
  <label>البريد الإلكتروني<input name="email" type="email" autocomplete="email" dir="ltr" required></label>
  <label>كلمة المرور (8 أحرف على الأقل)<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
  <label>تأكيد كلمة المرور<input name="confirm" type="password" autocomplete="new-password" required></label>
  <p id="formMsg" class="form-msg" role="alert"></p>
  <button class="btn lg" type="submit">أنشئ حسابي</button>
  <p>لديك حساب؟ <a class="lnk" href="login.html">سجّل الدخول</a></p>
</form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/site.js"></script>
<script src="js/ui.js"></script>
<script src="js/guards.js"></script>
<script src="js/auth.js"></script>
</body></html>
