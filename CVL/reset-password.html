<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>كلمة مرور جديدة | Civil Academy 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/home.css"><link rel="stylesheet" href="css/dashboard.css">
<script src="js/theme.js"></script>
</head>
<body class="auth">
<div class="glass auth-card">
  <a class="logo" href="index.html">Civil Academy 3D</a>
  <h1>كلمة مرور جديدة</h1>
  <p id="resetState" class="form-msg" role="status">جارٍ التحقق من الرابط...</p>
  <a id="again" class="btn" href="forgot-password.html" hidden>اطلب رابطاً جديداً</a>
  <form id="resetForm" class="stack" hidden novalidate>
    <label>كلمة المرور الجديدة (8 أحرف على الأقل)<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>تأكيد كلمة المرور<input name="confirm" type="password" autocomplete="new-password" required></label>
    <p id="formMsg" class="form-msg" role="alert"></p>
    <button class="btn lg" type="submit">احفظ كلمة المرور</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/site.js"></script>
<script src="js/ui.js"></script>
<script src="js/guards.js"></script>
<script src="js/reset.js"></script>
</body></html>
